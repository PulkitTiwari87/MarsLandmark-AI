# Default project configuration.
# Values below are engineering defaults, NOT results of hyperparameter
# search — no search has been run yet (see docs/EXPERIMENTS.md).

seed: 42

data:
  dataset_name: "hirise-landmark-v3"  # Zenodo DOI 10.5281/zenodo.2538136 — see docs/DATASET.md
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  image_size: 227  # matches the source dataset's native crop size
  batch_size: 32
  num_workers: 4
  val_fraction: 0.15  # grouped split (src/data/split.py); measured result in docs/DATA_SPLIT.md
  test_fraction: 0.15

training:
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "cosine"
  early_stopping_patience: 5
  class_weighted_loss: false  # Phase 07 candidate; compare against docs/EXPERIMENTS.md's val macro F1 0.7188 baseline before enabling by default

model:
  name: "resnet18"  # actually trained/validated (docs/EXPERIMENTS.md); resnet50 not yet tried
  pretrained: true
  num_classes: 8

logging:
  experiment_registry: "experiments/experiments.csv"
  checkpoint_dir: "checkpoints"
